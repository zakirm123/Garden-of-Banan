function eye(g,x,y,z,s=.09){for(const k of[-1,1]){const e=new T.Mesh(new T.SphereGeometry(s*1.6,10,10),M(0xffffff)),p=new T.Mesh(new T.SphereGeometry(s,8,8),M(0));e.position.set(x*k,y,z);p.position.set(x*k,y,z+s*1.2);g.add(e,p)}}
function ch(k,col){const g=new T.Group(),mt=M(col).clone(),add=(geo,m,x,y,z,sx=1,sy=1,sz=1)=>{const o=new T.Mesh(geo,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);g.add(o);return o},Sp=r=>new T.SphereGeometry(r,16,12);
if(k=='egg'){add(Sp(.5),mt,0,.6,0,.9,1.25,.9);add(new T.ConeGeometry(.12,.3,8),M(0xff9a1f),0,.75,.5).rotation.x=Math.PI/2;eye(g,.18,.95,.38)}
else if(k=='lime'){add(Sp(.7),mt,0,1.1,0,1,1.5,1);eye(g,.25,1.7,.6,.1);add(new T.BoxGeometry(.35,1.1,.35),M(0x1d6b1d),-.95,1.1,0);add(new T.BoxGeometry(.35,1.1,.35),M(0x1d6b1d),.95,1.1,0)}
else if(k=='pbj'){add(new T.BoxGeometry(.9,1.4,.5),mt,0,.9,0);add(new T.BoxGeometry(.92,.35,.52),M(0x7b1fa2),0,.6,0);add(Sp(.3),M(0xd9a441),0,1.75,0);eye(g,.17,1.5,.26)}
else{add(new T.CylinderGeometry(.35,.45,1.4,14),mt,0,.8,0);add(Sp(.4),mt,0,1.5,0,1,.8,1);add(new T.CylinderGeometry(.06,.08,.25),M(0x6b4a1f),0,1.95,0);eye(g,.17,1.35,.35);

function tp(t,w,h,x,y,z,ry=0,bg='#fff8e1',fg='#222',fs=34){const c=document.createElement('canvas');c.width=512;c.height=Math.round(512*h/w);const q=c.getContext('2d');q.fillStyle=bg;q.fillRect(0,0,512,c.height);q.fillStyle=fg;q.textAlign='center';q.font='bold '+fs+'px sans-serif';const L=t.split('\n');L.forEach((l,i)=>q.fillText(l,256,c.height/(L.length+1)*(i+1)+10));const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),color:0xb4b4b4}));m.position.set(x,y,z);m.rotation.y=ry;sc.add(m)}
const kc=(x,y,z,c,v=1)=>{const m=bx(.5,.05,.3,x,y,z,c);m.visible=!!v;return m};

const S={go:0,blue:0,batt:0,remote:0,btn1:0,eggs:0,fed:0,purple:0,glass:0,btn2:0,hammer:0,wood:0,lifted:0,solved:0,yellow:0,plat:0,chase:0,fell:0,elev:0,end:0,dr:0,launched:0,pink:0,note:0,ride:0,rt:0,rise:0};

const VP={'Tommy':[1.7,1.1],'Dad':[.6,.9],'Eggy Bird':[1.6,1.3],'Mr Large Lime Man':[.1,.6]};

const NOTE='A note from Dad\n\nDear Tommy,\n\nIf you are reading this, you found my secret room. I am so proud of you.\n\nThis is not a normal preschool. I am sorry I lied to you.\n\nDo not trust the Banan family, and never let Eggy Bird catch you. The elevator at the end goes down to where I am. Keep going, buddy.\n\nP.S. Always carry a Snickers bar. You get grumpy when you are hungry.\n\nLove, Dad\n\n(tap or press E to close)';
function note(){S.note=1;$('nt').textContent=NOTE;$('nt').style.display='block';voice(NOTE.replace(/\(tap.*\)/,'').replace(/\n+/g,' '),'Dad')}

const MC=['#e23030','#ffd21f','#3ecf3e','#8b5a2b','#ffffff'];
function mural(x,y,z,ry,w,h,bg,cap){const c=document.createElement('canvas');c.width=1024;const H=c.height=Math.round(1024*h/w),q=c.getContext('2d');q.fillStyle=bg;q.fillRect(0,0,1024,H);q.fillStyle='#ffffff66';for(let i=0;i<5;i++){q.beginPath();q.arc(100+i*220,H,120+i%2*60,Math.PI,0);q.fill()}q.fillStyle='#ffd21f';q.beginPath();q.arc(950,H*.3,45,0,7);q.fill();q.fillStyle='#222';q.font='bold 56px sans-serif';q.textAlign='center';q.fillText(cap,512,72);q.lineWidth=5;q.strokeStyle='#222';MC.forEach((col,i)=>{const cx=1024/6*(i+1),cy=H*.65;q.fillStyle=col;q.beginPath();q.ellipse(cx,cy,70,100,0,0,7);q.fill();q.stroke();q.fillStyle='#fff';[-25,25].forEach(d=>{q.beginPath();q.arc(cx+d,cy-30,18,0,7);q.fill();q.stroke()});q.fillStyle='#000';[-25,25].forEach(d=>{q.beginPath();q.arc(cx+d,cy-28,8,0,7);q.fill()});q.beginPath();q.arc(cx,cy,30,.1,Math.PI-.1);q.stroke()});const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),color:0x999999}));m.position.set(x,y,z);m.rotation.y=ry;sc.add(m)}
